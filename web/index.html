<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хранитель Алтаря (Altar Guardian)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Хранитель Алтаря</h1>
            <div class="resource-bar">
                <div class="resource-item">День: <span id="day-count">1</span></div>
                <div class="resource-item">Мана: <span id="mana-count">100</span></div>
                <div class="resource-item">Провизия: <span id="supplies-count">50</span></div>
                <div class="resource-item">Материя: <span id="fragments-count">0</span></div>
            </div>
        </header>
        <div class="day-progress" aria-hidden="true"><div id="day-progress-fill"></div></div>

        <main>
            <!-- Этап 1: сцена. id-шники групп нужны для анимаций следующих этапов -->
            <div id="scene" role="img" aria-label="Стражники охраняют алтарь за каменными стенами">
                <svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#0a0c24"/>
                            <stop offset="1" stop-color="#33244f"/>
                        </linearGradient>
                        <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#8ff5ff"/>
                            <stop offset="1" stop-color="#8a5cff"/>
                        </linearGradient>
                        <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#7a768a"/>
                            <stop offset="1" stop-color="#3f3c50"/>
                        </linearGradient>
                        <radialGradient id="glow">
                            <stop offset="0" stop-color="#9ff7ff" stop-opacity=".65"/>
                            <stop offset="1" stop-color="#9ff7ff" stop-opacity="0"/>
                        </radialGradient>
                        <radialGradient id="torchGlow">
                            <stop offset="0" stop-color="#ffa63d" stop-opacity=".55"/>
                            <stop offset="1" stop-color="#ffa63d" stop-opacity="0"/>
                        </radialGradient>
                        <pattern id="bricksBack" width="36" height="18" patternUnits="userSpaceOnUse">
                            <rect width="36" height="18" fill="#47445a"/>
                            <path d="M0 .5H36M0 9.5H36M18 .5V9.5M0 9.5V18M36 9.5V18" fill="none" stroke="#000" stroke-opacity=".3"/>
                        </pattern>
                        <pattern id="bricksFront" width="36" height="18" patternUnits="userSpaceOnUse">
                            <rect width="36" height="18" fill="#625f76"/>
                            <path d="M0 .5H36M0 9.5H36M18 .5V9.5M0 9.5V18M36 9.5V18" fill="none" stroke="#000" stroke-opacity=".28"/>
                        </pattern>
                        <g id="guard-shape">
                            <ellipse cx="0" cy="0" rx="11" ry="3" fill="#000" opacity=".4"/>
                            <line x1="10" y1="1" x2="10" y2="-40" stroke="#b9b2a0" stroke-width="1.6"/>
                            <polygon points="10,-47 7.2,-39 12.8,-39" fill="#e6dfc8"/>
                            <rect x="-5" y="-8" width="10" height="8" fill="#2b2f4a"/>
                            <rect x="-7" y="-22" width="14" height="15" rx="3" fill="#3d5a80"/>
                            <rect x="-2" y="-22" width="4" height="15" fill="#d4af37"/>
                            <ellipse cx="-9" cy="-14" rx="5" ry="7" fill="#8c6d1f" stroke="#d4af37" stroke-width="1"/>
                            <circle cx="0" cy="-27" r="5.5" fill="#e3b98f"/>
                            <path d="M-6.2 -27 A6.2 6.2 0 0 1 6.2 -27 Z" fill="#aab1c2"/>
                            <rect x="-1" y="-37" width="2" height="5" fill="#c23b3b"/>
                        </g>
                    <g id="enemy-shape">
                            <ellipse cx="0" cy="0" rx="11" ry="3" fill="#000" opacity=".4"/>
                            <path d="M-11 0 C-14 -14 -8 -26 0 -26 C8 -26 14 -14 11 0 L7 -4 L3 0 L0 -4 L-3 0 L-7 -4 Z" fill="#2a1647" stroke="#8a4dff" stroke-width="1"/>
                            <circle cx="-4" cy="-16" r="2.2" fill="#ff4d6d"/><circle cx="4" cy="-16" r="2.2" fill="#ff4d6d"/>
                        </g>
                    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#4f78b8"/>
                            <stop offset="1" stop-color="#f4c58c"/>
                        </linearGradient>
                    </defs>

                    <!-- Небо -->
                    <rect width="800" height="340" fill="url(#sky)"/>
                    <rect id="sky-day" width="800" height="340" fill="url(#skyDay)"/>
                    <g id="stars" fill="#fff">
                        <circle class="star" cx="60" cy="40" r="1.4" style="--d:0s"/>
                        <circle class="star" cx="130" cy="82" r="1" style="--d:.8s"/>
                        <circle class="star" cx="230" cy="28" r="1.6" style="--d:1.6s"/>
                        <circle class="star" cx="320" cy="64" r="1" style="--d:.4s"/>
                        <circle class="star" cx="470" cy="34" r="1.4" style="--d:1.2s"/>
                        <circle class="star" cx="540" cy="76" r="1" style="--d:2s"/>
                        <circle class="star" cx="610" cy="26" r="1.5" style="--d:.6s"/>
                        <circle class="star" cx="740" cy="70" r="1.2" style="--d:1.4s"/>
                        <circle class="star" cx="770" cy="30" r="1" style="--d:.2s"/>
                    </g>
                    <circle class="moon" cx="690" cy="52" r="20" fill="#e8e2c8"/>
                    <circle class="sun" cx="120" cy="64" r="22" fill="#ffe9a8"/>
                    <path class="hill-far" d="M0 250 Q120 205 260 240 T520 232 T800 245 V340 H0Z" fill="#171431"/>
                    <path class="hill-near" d="M0 272 Q400 238 800 272 V340 H0Z" fill="#221f36"/>
                    <g id="rays" fill="#ffe9a8">
                        <polygon points="400,200 388,-160 412,-160" transform="rotate(0 400 200)"/>
                        <polygon points="400,200 388,-160 412,-160" transform="rotate(36 400 200)"/>
                        <polygon points="400,200 388,-160 412,-160" transform="rotate(72 400 200)"/>
                        <polygon points="400,200 388,-160 412,-160" transform="rotate(108 400 200)"/>
                        <polygon points="400,200 388,-160 412,-160" transform="rotate(144 400 200)"/>
                        <polygon points="400,200 388,-160 412,-160" transform="rotate(180 400 200)"/>
                        <polygon points="400,200 388,-160 412,-160" transform="rotate(216 400 200)"/>
                        <polygon points="400,200 388,-160 412,-160" transform="rotate(252 400 200)"/>
                        <polygon points="400,200 388,-160 412,-160" transform="rotate(288 400 200)"/>
                        <polygon points="400,200 388,-160 412,-160" transform="rotate(324 400 200)"/>
                    </g>

                    <!-- Стены и башни -->
                    <g id="walls">
                        <rect x="170" y="170" width="460" height="86" fill="url(#bricksBack)"/>
                        <line x1="170" y1="164" x2="630" y2="164" stroke="#47445a" stroke-width="12" stroke-dasharray="22 14"/>
                        <path d="M372 256 V212 A28 28 0 0 1 428 212 V256Z" fill="#12112a"/>

                        <rect id="tower-left" x="110" y="118" width="62" height="142" fill="url(#bricksFront)"/>
                        <line x1="110" y1="112" x2="172" y2="112" stroke="#625f76" stroke-width="12" stroke-dasharray="14 8"/>
                        <rect id="tower-right" x="628" y="118" width="62" height="142" fill="url(#bricksFront)"/>
                        <line x1="628" y1="112" x2="690" y2="112" stroke="#625f76" stroke-width="12" stroke-dasharray="14 8"/>
                        <rect class="window" x="134" y="140" width="14" height="24" rx="7" fill="#ffb347"/>
                        <rect class="window" x="652" y="140" width="14" height="24" rx="7" fill="#ffb347"/>

                        <!-- Повреждения стен: уровни 1-3 включаются из game.js -->
                        <g class="dmg dmg-1 crack">
                            <path d="M250 176 l8 14 -6 12 10 16"/><path d="M520 186 l-7 12 8 10 -4 14"/>
                            <path d="M125 150 l8 14 -5 12"/><path d="M672 160 l-6 12 7 10"/>
                        </g>
                        <g class="dmg dmg-2 crack">
                            <path d="M330 196 l10 12 -8 14 12 18"/><path d="M450 172 l6 16 -9 12"/><path d="M580 205 l-8 10 6 14"/>
                            <path d="M155 190 l-8 14 6 12 -4 14"/><path d="M645 205 l8 12 -6 14"/>
                        </g>
                        <g class="dmg dmg-3">
                            <polygon points="470,164 500,164 506,184 494,196 480,190 472,176" fill="#1b1838"/>
                            <path class="crack" d="M300 170 l12 22 -10 16 14 24 -8 22"/>
                            <path class="crack" d="M118 220 l10 10 -6 14 8 14"/><path class="crack" d="M680 190 l-9 14 7 12"/>
                        </g>

                        <circle cx="141" cy="198" r="22" fill="url(#torchGlow)"/>
                        <circle cx="659" cy="198" r="22" fill="url(#torchGlow)"/>
                        <rect x="139" y="200" width="4" height="12" fill="#3a2a1a"/>
                        <rect x="657" y="200" width="4" height="12" fill="#3a2a1a"/>
                        <ellipse class="flame" cx="141" cy="196" rx="5" ry="8" fill="#ff8a1f"/>
                        <ellipse class="flame" cx="659" cy="196" rx="5" ry="8" fill="#ff8a1f" style="--d:.5s"/>
                    </g>

                    <!-- Площадка и руны -->
                    <ellipse cx="400" cy="286" rx="232" ry="34" fill="url(#platform)"/>
                    <ellipse class="rune-ring" cx="400" cy="287" rx="170" ry="22" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="6 10" opacity=".7"/>
                    <ellipse class="train-ring" cx="400" cy="287" rx="20" ry="3" fill="none" stroke="#ffd84d" stroke-width="2"/>

                    <!-- Алтарь -->
                    <g id="altar">
                        <polygon points="358,288 442,288 430,272 370,272" fill="#6d6a7e"/>
                        <polygon points="372,272 428,272 420,259 380,259" fill="#807c93"/>
                        <rect x="386" y="228" width="28" height="31" fill="#928ea6"/>
                        <rect x="376" y="221" width="48" height="8" fill="#a8a4bc" stroke="#d4af37" stroke-width="1.2"/>
                        <circle class="halo" cx="400" cy="200" r="46" fill="url(#glow)"/>
                        <polygon class="crystal" points="400,180 412,199 400,218 388,199" fill="url(#crystal)" stroke="#d9fbff" stroke-width=".8"/>
                        <circle class="spark" cx="391" cy="214" r="1.6" fill="#bff" style="--d:0s"/>
                        <circle class="spark" cx="409" cy="214" r="1.4" fill="#bff" style="--d:.9s"/>
                        <circle class="spark" cx="400" cy="216" r="1.8" fill="#bff" style="--d:1.7s"/>
                        <circle class="spark" cx="396" cy="212" r="1.2" fill="#bff" style="--d:2.3s"/>
                    </g>

                    <!-- Передние стены -->
                    <g id="walls-front">
                        <rect x="118" y="262" width="182" height="36" fill="url(#bricksFront)"/>
                        <line x1="118" y1="258" x2="300" y2="258" stroke="#625f76" stroke-width="8" stroke-dasharray="16 10"/>
                        <rect x="500" y="262" width="182" height="36" fill="url(#bricksFront)"/>
                        <line x1="500" y1="258" x2="682" y2="258" stroke="#625f76" stroke-width="8" stroke-dasharray="16 10"/>
                        <g class="dmg dmg-1 crack"><path d="M170 266 l6 12 -5 10"/><path d="M620 268 l-5 10 6 12"/></g>
                        <g class="dmg dmg-2 crack"><path d="M230 264 l8 14 -7 14"/><path d="M540 266 l6 12 -8 14"/></g>
                        <g class="dmg dmg-2 rubble">
                            <polygon points="304,298 314,292 322,299 312,303"/><polygon points="486,299 494,293 502,299 494,304"/>
                        </g>
                        <g class="dmg dmg-3">
                            <polygon points="230,258 262,258 258,276 240,282 228,270" fill="#221f36"/>
                            <polygon points="590,258 622,258 618,274 604,280 592,268" fill="#221f36"/>
                            <g class="rubble">
                                <polygon points="200,300 212,293 222,301 210,306"/><polygon points="252,284 262,280 268,288 258,292"/>
                                <polygon points="632,300 644,294 654,302 642,307"/><polygon points="606,285 616,280 622,288 612,292"/>
                                <polygon points="322,305 332,300 338,307 328,310"/>
                            </g>
                        </g>
                    </g>

                    <!-- Стражники: 8 мест, число видимых зависит от Guard Strength -->
                    <g id="guards">
                        <g transform="translate(335 292)"><g class="guard-slot"><g class="guard-body" style="--d:.6s"><use href="#guard-shape"/></g></g></g>
                        <g transform="translate(465 292)"><g class="guard-slot"><g class="guard-body" style="--d:1.5s"><use href="#guard-shape"/></g></g></g>
                        <g transform="translate(372 312) scale(1.15)"><g class="guard-slot"><g class="guard-body" style="--d:.9s"><use href="#guard-shape"/></g></g></g>
                        <g transform="translate(428 312) scale(1.15)"><g class="guard-slot"><g class="guard-body" style="--d:.3s"><use href="#guard-shape"/></g></g></g>
                        <g transform="translate(240 170) scale(0.85)"><g class="guard-slot hidden"><g class="guard-body" style="--d:.2s"><use href="#guard-shape"/></g></g></g>
                        <g transform="translate(560 170) scale(0.85)"><g class="guard-slot hidden"><g class="guard-body" style="--d:1.1s"><use href="#guard-shape"/></g></g></g>
                        <g transform="translate(141 110) scale(0.8)"><g class="guard-slot hidden"><g class="guard-body" style="--d:1.8s"><use href="#guard-shape"/></g></g></g>
                        <g transform="translate(659 110) scale(0.8)"><g class="guard-slot hidden"><g class="guard-body" style="--d:.7s"><use href="#guard-shape"/></g></g></g>
                    </g>
                
                    <!-- Этап 4: ночь. Враги и молнии создаются в game.js внутри #enemies -->
                    <rect id="night-shade" width="800" height="340" fill="#1a0b33"/>
                    <ellipse id="shield" cx="400" cy="235" rx="150" ry="105" fill="url(#glow)" stroke="#9ff7ff" stroke-width="2"/>
                    <g id="enemies"></g>
                    <rect id="hit-flash" width="800" height="340" fill="#ff1f3d"/>

                    <!-- Этап 3: эффекты дневных действий (включаются классами fx-* на #scene) -->
                    <g id="cart-wrap" transform="translate(0 332)">
                        <g class="cart">
                            <ellipse cx="0" cy="0" rx="28" ry="3" fill="#000" opacity=".4"/>
                            <line x1="24" y1="-12" x2="38" y2="-21" stroke="#3a2a1a" stroke-width="2.5" stroke-linecap="round"/>
                            <rect x="-24" y="-16" width="48" height="10" rx="2" fill="#6b4a2b" stroke="#3a2a1a"/>
                            <rect x="-19" y="-27" width="15" height="11" fill="#a9783f" stroke="#5a3f1f"/>
                            <rect x="-2" y="-30" width="15" height="14" fill="#c08a4a" stroke="#5a3f1f"/>
                            <circle cx="19" cy="-21" r="6" fill="#d9c28a"/>
                            <g class="wheel"><circle cx="-14" cy="-5" r="6" fill="#2b1d12" stroke="#8a6a3a" stroke-width="1.5"/><path d="M-14 -11V1M-20 -5H-8" stroke="#8a6a3a"/></g>
                            <g class="wheel"><circle cx="14" cy="-5" r="6" fill="#2b1d12" stroke="#8a6a3a" stroke-width="1.5"/><path d="M14 -11V1M8 -5H20" stroke="#8a6a3a"/></g>
                        </g>
                    </g>

                    <g class="builder" transform="translate(200 296)">
                        <g class="hammer">
                            <line x1="0" y1="0" x2="0" y2="-18" stroke="#8a6a3a" stroke-width="3" stroke-linecap="round"/>
                            <rect x="-8" y="-26" width="16" height="8" rx="1.5" fill="#aab1c2" stroke="#4a4e5e"/>
                        </g>
                        <circle class="hspark" cx="0" cy="-26" r="1.7" fill="#ffd76a" style="--dx:-16px;--dy:-12px"/>
                        <circle class="hspark" cx="0" cy="-26" r="1.5" fill="#fff2b0" style="--dx:12px;--dy:-16px"/>
                        <circle class="hspark" cx="0" cy="-26" r="1.3" fill="#ffd76a" style="--dx:-4px;--dy:-22px"/>
                        <circle class="hspark" cx="0" cy="-26" r="1.6" fill="#ffb347" style="--dx:18px;--dy:-4px"/>
                    </g>
                    <g class="builder" transform="translate(600 296) scale(-1 1)">
                        <g class="hammer" style="animation-delay:.2s">
                            <line x1="0" y1="0" x2="0" y2="-18" stroke="#8a6a3a" stroke-width="3" stroke-linecap="round"/>
                            <rect x="-8" y="-26" width="16" height="8" rx="1.5" fill="#aab1c2" stroke="#4a4e5e"/>
                        </g>
                        <circle class="hspark" cx="0" cy="-26" r="1.7" fill="#ffd76a" style="--dx:-16px;--dy:-12px;animation-delay:.2s"/>
                        <circle class="hspark" cx="0" cy="-26" r="1.5" fill="#fff2b0" style="--dx:12px;--dy:-16px;animation-delay:.2s"/>
                        <circle class="hspark" cx="0" cy="-26" r="1.3" fill="#ffd76a" style="--dx:-4px;--dy:-22px;animation-delay:.2s"/>
                    </g>

                    <g id="motes">
                        <circle class="mote" cx="230" cy="300" r="2.2" fill="#9ff7ff" style="--dx:170px;--dy:-100px;--d:0.0s"/>
                        <circle class="mote" cx="280" cy="312" r="2.2" fill="#9ff7ff" style="--dx:120px;--dy:-112px;--d:0.1s"/>
                        <circle class="mote" cx="330" cy="318" r="2.2" fill="#9ff7ff" style="--dx:70px;--dy:-118px;--d:0.2s"/>
                        <circle class="mote" cx="370" cy="322" r="2.2" fill="#9ff7ff" style="--dx:30px;--dy:-122px;--d:0.3s"/>
                        <circle class="mote" cx="430" cy="322" r="2.2" fill="#9ff7ff" style="--dx:-30px;--dy:-122px;--d:0.4s"/>
                        <circle class="mote" cx="470" cy="318" r="2.2" fill="#9ff7ff" style="--dx:-70px;--dy:-118px;--d:0.5s"/>
                        <circle class="mote" cx="520" cy="312" r="2.2" fill="#9ff7ff" style="--dx:-120px;--dy:-112px;--d:0.6s"/>
                        <circle class="mote" cx="570" cy="300" r="2.2" fill="#9ff7ff" style="--dx:-170px;--dy:-100px;--d:0.7s"/>
                    </g>
                </svg>
            </div>

            <div id="game-log" class="log-window">
                <p>Добро пожаловать в Хранителя Алтаря...</p>
            </div>
            
            <div class="status-display">
                <p>Стены: <span id="wall-health">100</span>% | Стражники: <span id="guard-strength">10</span></p>
            </div>
        </main>

        <footer>
            <div class="action-panel" id="action-panel">
                <button class="action-btn" onclick="game.handleAction('supply')">Сбор провизии (+20)</button>
                <button class="action-btn" onclick="game.handleAction('fortify')">Укрепить стены (+20)</button>
                <button class="action-btn" onclick="game.handleAction('train')">Обучение (+10)</button>
                <button class="action-btn" onclick="game.handleAction('rest')">Отдых (Восстановление)</button>
            </div>
        </footer>

        <div id="end-screen" role="dialog" aria-live="polite" aria-hidden="true">
            <h2 id="end-title"></h2>
            <p id="end-text"></p>
            <div id="end-stats"></div>
            <button class="action-btn" id="restart-btn" onclick="location.reload()">Играть снова</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
